const pages=[
{type:'cover',title:'شركة رؤى المبدعون',sub:'للمقاولات العامة والبنية التحتية',tag:'رؤى تبني المستقبل… وإبداع يصنع الفارق',body:'ملف تعريفي مؤسسي | المملكة العربية السعودية'},
{type:'intro',title:'من نحن',body:'في شركة رؤى المبدعون للمقاولات العامة والبنية التحتية، نؤمن أن البناء ليس مجرد تشييد حجارة، بل هو صناعة مستقبل أفضل. نسعى إلى تقديم حلول إنشائية وتقنية متكاملة ترتكز على الجودة والالتزام والابتكار، وتستجيب لاحتياجات العملاء وتطلعاتهم.',sub:'نعمل على الجمع بين الأعمال الإنشائية والبنية التحتية والحلول التقنية ضمن نطاق الخدمات الموضح في ملف الشركة.'},
{type:'vision',title:'رؤيتنا ورسالتنا',body:'أن نكون شريكاً موثوقاً في تقديم حلول المقاولات والبنية التحتية في المملكة العربية السعودية، وأن نسهم في تطوير بيئات عمرانية وتشغيلية أكثر كفاءة واستدامة.',sub:'نسعى إلى تقديم خدمات ومشاريع متكاملة ترتقي بالمعايير الهندسية، من خلال حلول عملية وكوادر مؤهلة والالتزام بمتطلبات الجودة والسلامة.'},
{type:'values',title:'قيمنا المؤسسية',tiles:[['الجودة','نضع التميز والعناية بالتفاصيل في صميم تنفيذ الأعمال.'],['الالتزام','نلتزم بالمواعيد والمتطلبات والمعايير المهنية.'],['السلامة','حماية الأفراد والممتلكات أولوية في بيئة العمل.'],['الابتكار','نواكب التطور ونبحث عن حلول أكثر كفاءة.'],['الشفافية','نعتمد الوضوح والمصداقية في تعاملاتنا.']]},
{type:'services',title:'المقاولات والأعمال المدنية',items:[['مقاولات المباني','تنفيذ الأعمال الإنشائية والمعمارية للمباني والمنشآت، بدءاً من مراجعة المخططات وتجهيز الموقع وحتى مراحل التنفيذ والفحص والتسليم، وفق نطاق العقد والمواصفات المعتمدة.'],['أعمال الأسفلت','تنفيذ وتجهيز أعمال السفلتة للطرق والساحات والمواقف، بما يشمل إعداد الطبقات وتسوية المناسيب وأعمال الرصف، مع مراعاة متطلبات الجودة والسلامة والمواصفات الفنية لكل مشروع.'],['أعمال الإنترلوك','توريد وتركيب ورصف الإنترلوك للممرات والساحات ومواقف السيارات، مع تجهيز طبقات الأساس وضبط المناسيب والفواصل والتشطيبات النهائية بما يحقق المتانة والتناسق البصري.'],['البنية التحتية','تنفيذ وتجهيز الأعمال المرتبطة بتطوير المواقع والبنية التحتية، والتنسيق بين الأعمال المدنية والخدمات ذات الصلة، وفق المخططات المعتمدة ومتطلبات الجهة المالكة.'],['أعمال الديكور','تنفيذ أعمال التشطيبات والديكورات الداخلية، ومعالجة الأسطح وتركيب العناصر الجمالية والوظيفية، مع الاهتمام بجودة الخامات ودقة التفاصيل والالتزام بالتصميم المعتمد.']]},
{type:'services',title:'الكهرباء والأتمتة والسلامة',items:[['الأعمال الكهربائية','تنفيذ وتمديد الأعمال الكهربائية وشبكات القوى والإنارة، وتركيب المكونات واللوحات ذات الصلة، مع إجراء الفحوصات اللازمة والتقيد بالمخططات والاشتراطات الفنية المعتمدة.'],['الأتمتة والتحكم','تقديم حلول التحكم والأتمتة لرفع كفاءة التشغيل، وربط الأنظمة والأجهزة وفق الاحتياج الفني، بما يساعد على تحسين المراقبة وسهولة الإدارة والاستجابة التشغيلية.'],['أعمال السلامة','دعم تجهيز المواقع بمتطلبات السلامة والحماية المناسبة لطبيعة الأعمال، وتحديد المخاطر التشغيلية ومتابعة إجراءات الوقاية والتنبيه والتوعية بالتنسيق مع الجهات المختصة.'],['التكامل الفني','تنسيق الأنظمة ذات الصلة بما يخدم متطلبات المشروع.']]},
{type:'services',title:'الشبكات والاتصالات',items:[['صيانة الشبكات','فحص الشبكات ومعالجة الأعطال وتحسين الأداء، وتنظيم التوصيلات ومراجعة نقاط الاتصال، مع تقديم دعم فني يساعد على تقليل الانقطاعات وتعزيز استمرارية الخدمة.'],['كابلات UTP','تركيب وتوصيل كابلات الشبكات الهيكلية.'],['الألياف الضوئية','تنفيذ أعمال تمديد وتوصيل الألياف الضوئية وتجهيز المسارات ونقاط الربط، وإجراء الاختبارات الفنية المناسبة للتحقق من جودة الاتصال وفق مواصفات المشروع.'],['أنظمة الاتصالات','تصميم وتنفيذ أنظمة الاتصالات السلكية واللاسلكية وشبكات الهاتف ونقل البيانات.']]},
{type:'services',title:'الصيانة والدعم التقني',items:[['عقود الصيانة السنوية AMC','إعداد وتنفيذ برامج صيانة وقائية وتصحيحية وفق نطاق الخدمة، تشمل جدولة الزيارات والفحص الدوري وتسجيل البلاغات ومتابعة المعالجة ورفع تقارير حالة الأصول والأنظمة.'],['أمن الجدار الناري','دعم إعداد وإدارة سياسات الحماية ومراجعة قواعد الوصول ومتابعة التنبيهات الأمنية، وفق الصلاحيات ونطاق العمل المعتمد ومتطلبات أمن المعلومات لدى العميل.'],['استمرارية الأعمال','العمل على تقليل التوقفات ومعالجة الأعطال وتحسين جاهزية الأنظمة.']]},
{type:'why',title:'لماذا رؤى المبدعون؟',tiles:[['تنوع الخدمات','مجالات تجمع بين المقاولات والبنية التحتية والحلول التقنية.'],['منهجية متكاملة','التعامل مع احتياجات المشروع من التخطيط إلى التنفيذ والمتابعة.'],['الجودة والسلامة','الاهتمام بمتطلبات الجودة والسلامة في تنفيذ الأعمال.'],['مرونة التنفيذ','تكييف نطاق العمل وفق احتياجات العميل ومتطلبات كل مشروع.']]},
{type:'method',title:'منهجية العمل',steps:[['01','فهم المتطلبات','تحليل وثائق المشروع ومراجعة المخططات والمواصفات وتحديد احتياجات العميل ونطاق الأعمال ومخرجات التسليم.'],['02','التخطيط والتجهيز','إعداد خطة التنفيذ والبرنامج الزمني وتقدير الموارد والمعدات وآلية التنسيق وإدارة المخاطر.'],['03','التنفيذ والمتابعة','إدارة فرق العمل ومتابعة التقدم الميداني وضبط الجودة والسلامة ومعالجة الملاحظات أولاً بأول.'],['04','الفحص والتسليم','إجراء الفحوصات النهائية واستكمال الملاحظات وتجهيز الوثائق ومحاضر الاستلام والتسليم حسب العقد.']]},
{type:'quality',title:'الجودة والصحة والسلامة',body:'تتبنى الشركة نهجاً يضع الجودة والصحة والسلامة في صميم إدارة الأعمال. ويبدأ ذلك بمراجعة نطاق المشروع ومواصفاته، وتحديد نقاط الفحص والمتابعة، والتحقق من مطابقة المواد والأعمال للمتطلبات المعتمدة، وتوثيق الملاحظات والإجراءات التصحيحية حتى الإغلاق والتسليم. كما تُراعى متطلبات سلامة العاملين والزوار والممتلكات، وإدارة المخاطر بالموقع، والتنسيق مع ممثلي العميل والاستشاري.',sub:'تفاصيل شهادات الجودة أو الاعتمادات أو أنظمة الإدارة الرسمية: نقص بيانات – يلزم استكمالها.'},
{type:'sectors',title:'القطاعات ومجالات العمل',tiles:[['المباني والمنشآت','أعمال المقاولات والمباني.'],['الطرق والرصف','أعمال الأسفلت والإنترلوك.'],['البنية التحتية التقنية','الشبكات والاتصالات والألياف الضوئية.'],['المنشآت التجارية والإدارية','حلول كهربائية وأتمتة وصيانة وفق نطاق المشروع.']]},

let current=0,editing=false,customFonts=[];const deck=document.getElementById('deck'),nav=document.getElementById('nav');
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function logo(){return `<img class="mini-logo" src="${LOGO}" alt="شعار الشركة">`}
function tile(t){return `<div class="tile"><b class="editable">${esc(t[0])}</b><span class="editable">${esc(t[1])}</span></div>`}
function render(){deck.innerHTML='';nav.innerHTML='';pages.forEach((p,i)=>{let el=document.createElement('article');el.className='slide'+(i===current?' active':'');el.dataset.index=i;let content='';if(p.type==='cover'){el.classList.add('cover');content=`<div class="cover-copy"><div class="eyebrow">الملف التعريفي للشركة</div><h2 class="editable">${esc(p.title)}</h2><p class="editable">${esc(p.sub)}</p><div class="tag editable">${esc(p.tag)}</div><p class="editable">${esc(p.body)}</p></div><div class="logo-wrap"><img src="${LOGO}" alt="شعار RMC"></div>`}else if(p.type==='contact'){el.classList.add('contact');content=`${logo()}<div style="width:100%;z-index:1"><div class="eyebrow">يسعدنا التواصل معكم</div><h2 class="editable">${esc(p.title)}</h2><p class="editable">${esc(p.body)}</p><div class="pillars">${p.tiles.map(tile).join('')}</div><p style="margin-top:24px;color:#efb51b" class="editable">${esc('رؤى تبني المستقبل… وإبداع يصنع الفارق')}</p></div>`}else{let left=p.type==='org'?`<div class="org-chart"><div class="org-node top">الإدارة العامة</div><div class="org-connector"></div><div class="org-row">${p.tiles.map((t)=>`<div class="org-node"><b class="editable">${esc(t[0])}</b><span class="editable">${esc(t[1])}</span></div>`).join('')}</div><div class="org-note">هيكل تنظيمي استرشادي قابل للتعديل وفق الهيكل المعتمد وحجم الشركة</div></div>`:p.tiles?`<div class="pillars">${p.tiles.map(tile).join('')}</div>`:p.items?`<div class="service-grid">${p.items.map(x=>`<div class="service"><i></i><b class="editable">${esc(x[0])}</b><span class="editable">${esc(x[1])}</span></div>`).join('')}</div>`:p.steps?`<div class="steps">${p.steps.map(x=>`<div class="step"><em>${esc(x[0])}</em><b class="editable">${esc(x[1])}</b><small class="editable">${esc(x[2])}</small></div>`).join('')}</div>`:'';content=`${logo()}<div class="two"><div><div class="eyebrow">شركة رؤى المبدعون | RMC</div><h2 class="editable">${esc(p.title)}</h2><p class="editable">${esc(p.body||'')}</p>${p.sub?`<p class="editable">${esc(p.sub)}</p>`:''}${left}</div><div class="visual"><strong>${esc(p.title)}</strong></div></div>`}el.innerHTML=content+`<span class="num">RMC　|　${String(i+1).padStart(2,'0')}</span>`;deck.appendChild(el);let b=document.createElement('button');b.textContent=String(i+1).padStart(2,'0')+'  '+p.title;b.className=i===current?'active':'';b.onclick=()=>show(i);nav.appendChild(b)});applyEdit()}
function show(i){current=Math.max(0,Math.min(pages.length-1,i));render()}function nextSlide(){show(current+1)}function prevSlide(){show(current-1)}function toggleEdit(){editing=!editing;applyEdit();toast(editing?'وضع التحرير مفعّل: اضغط على النص لتعديله':'تم إيقاف التحرير')}
function applyEdit(){document.querySelectorAll('.editable').forEach(x=>{x.contentEditable=editing?'true':'false';x.spellcheck=false})}
function collect(){document.querySelectorAll('.slide').forEach((s,i)=>{let p=pages[i],texts=[...s.querySelectorAll('.editable')].map(x=>x.innerText.trim()),k=0;if(p.type==='cover'){p.title=texts[k++]||p.title;p.sub=texts[k++]||p.sub;p.tag=texts[k++]||p.tag;p.body=texts[k++]||p.body;return}if(p.type==='contact'){p.title=texts[k++]||p.title;p.body=texts[k++]||p.body}else{p.title=texts[k++]||p.title;if(p.body!==undefined)p.body=texts[k++]||p.body;if(p.sub!==undefined)p.sub=texts[k++]||p.sub}let arr=p.tiles||p.items||p.steps;if(arr)arr.forEach((a)=>{a[0]=texts[k++]||a[0];let v=texts[k++];if(v!==undefined)a[1]=v})})}
function toast(t){let x=document.getElementById('toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',2600)}
function exportPDF(){window.print()}
async function exportPPTX(){if(!window.PptxGenJS){toast('تعذر تحميل مكتبة PowerPoint. تحقق من الاتصال بالإنترنت.');return}collect();let pptx=new pptxgen();pptx.layout='LAYOUT_WIDE';pptx.author='شركة رؤى المبدعون';pptx.subject='الملف التعريفي للشركة';pptx.title='شركة رؤى المبدعون';pptx.company='RMC';pptx.lang='ar-SA';const navy='211D4D',gold='EFB51B';for(let i=0;i<pages.length;i++){let p=pages[i],s=pptx.addSlide();s.background={color:p.type==='cover'||p.type==='contact'?navy:'FFFFFF'};if(p.type==='cover'){s.addImage({data:LOGO,x:7.3,y:1.55,w:5.2,h:2.2});s.addText(p.title,{x:.7,y:1.1,w:6.1,h:1.2,fontFace:'Arial',fontSize:30,bold:true,color:'FFFFFF',align:'right',breakLine:false,rtlMode:true});s.addText(p.sub+'\n'+p.tag,{x:.7,y:2.5,w:6.1,h:1.4,fontFace:'Arial',fontSize:19,color:'EFB51B',align:'right',rtlMode:true})}else{let y=.55;s.addImage({data:LOGO,x:.35,y:.25,w:1.2,h:.6});s.addText(p.title,{x:.7,y:.55,w:11.8,h:.7,fontFace:'Arial',fontSize:25,bold:true,color:p.type==='contact'?'FFFFFF':navy,align:'right',rtlMode:true});y=1.45;if(p.body)s.addText(p.body,{x:.8,y,w:11.4,h:1.35,fontFace:'Arial',fontSize:15,color:p.type==='contact'?'FFFFFF':'454454',align:'right',valign:'mid',rtlMode:true,breakLine:false,fit:'shrink'});y+=1.55;if(p.sub)s.addText(p.sub,{x:.8,y,w:11.4,h:1.05,fontFace:'Arial',fontSize:13,color:p.type==='contact'?'FFFFFF':'666477',align:'right',rtlMode:true,fit:'shrink'});y+=1.15;let arr=p.tiles||p.items||p.steps;if(arr){let cols=arr.length>4?3:2;let w=11.2/cols;arr.forEach((a,j)=>{let xx=.8+(j%cols)*w, yy=y+Math.floor(j/cols)*1.05;s.addShape(pptx.ShapeType.roundRect,{x:xx,y:yy,w:w-.12,h:.85,rectRadius:.08,fill:{color:p.type==='contact'?'302C62':'F5F4F1'},line:{color:gold,width:1}});s.addText(String(a[0])+'\n'+String(a[1]||a[2]||''),{x:xx+.1,y:yy+.08,w:w-.32,h:.68,fontFace:'Arial',fontSize:11,color:p.type==='contact'?'FFFFFF':navy,align:'right',valign:'mid',rtlMode:true,fit:'shrink'})})}}s.addShape(pptx.ShapeType.rect,{x:0,y:7.42,w:13.333,h:.08,line:{color:gold,transparency:100},fill:{color:gold}});s.addText('RMC  |  '+String(i+1).padStart(2,'0'),{x:.35,y:7.08,w:2.3,h:.2,fontFace:'Arial',fontSize:8,color:p.type==='contact'?'FFFFFF':'999999'});}await pptx.writeFile({fileName:'RMC_Company_Profile_AR.pptx'});toast('تم إنشاء ملف PowerPoint')}
function setFont(v){document.documentElement.style.setProperty('--font',v)}function setSize(v){document.querySelectorAll('.slide p').forEach(x=>x.style.fontSize=v+'px')}function setColor(k,v){document.documentElement.style.setProperty(k,v)}function resetStyle(){setColor('--navy','#211d4d');setColor('--gold','#efb51b');toast('تمت استعادة ألوان الهوية')}
function uploadFont(e){let f=e.target.files[0];if(!f)return;let url=URL.createObjectURL(f),name='Custom_'+f.name.replace(/\W/g,'_');let ff=new FontFace(name,`url(${url})`);ff.load().then(font=>{document.fonts.add(font);customFonts.push(name);let o=new Option(name,`'${name}',sans-serif`);document.getElementById('fontSelect').add(o);document.getElementById('fontSelect').value=o.value;setFont(o.value);toast('تم تحميل الخط وإضافته للقائمة')}).catch(()=>toast('تعذر تحميل هذا الخط'))}
function changeLogo(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{document.getElementById('brandLogo').src=r.result;document.querySelectorAll('.mini-logo,.logo-wrap img').forEach(x=>x.src=r.result);toast('تم تحديث الشعار في المعاينة')};r.readAsDataURL(f)}
function addImage(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{let p={type:'intro',title:'صورة إضافية',body:'وصف الصورة – اضغط هنا للتعديل',sub:'يمكن استبدال هذا النص بوصف المشروع أو الخدمة.'};pages.splice(current+1,0,p);render();let s=document.querySelectorAll('.slide')[current+1];let img=document.createElement('img');img.src=r.result;img.style.cssText='position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.23;pointer-events:none';s.prepend(img);show(current+1);toast('تمت إضافة صفحة مع الصورة')};r.readAsDataURL(f)}
function addPage(){pages.splice(current+1,0,{type:'intro',title:'عنوان القسم الجديد',body:'اضغط على النص بعد تفعيل التحرير لإضافة محتوى هذا القسم.',sub:'يمكنك تخصيص هذه الصفحة وإعادة ترتيبها لاحقاً.'});show(current+1)}
function saveProject(){collect();let data={pages,logo:document.getElementById('brandLogo').src};let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.href=u;a.download='RMC_Profile_Project.json';a.click();URL.revokeObjectURL(u);toast('تم تنزيل نسخة المشروع بصيغة JSON')}
render();
// Swipe navigation: drag horizontally across the presentation to change pages.
let swipeStart=null;deck.addEventListener('pointerdown',e=>{if(e.target.closest('[contenteditable=\"true\"]'))return;swipeStart={x:e.clientX,y:e.clientY,id:e.pointerId};});deck.addEventListener('pointerup',e=>{if(!swipeStart)return;const dx=e.clientX-swipeStart.x,dy=e.clientY-swipeStart.y;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.25){if(dx<0)nextSlide();else prevSlide();}swipeStart=null;});deck.addEventListener('pointercancel',()=>swipeStart=null);
